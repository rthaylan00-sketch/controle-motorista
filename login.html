<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DriveControl - Login</title>

  <!-- CSS do login -->
  <link rel="stylesheet" href="login.css">

</head>

<body>

  <div class="login-box">

    <h2>DriveControl</h2>

    <input 
      type="email" 
      id="email" 
      placeholder="Digite seu email"
    >

    <input 
      type="password" 
      id="senha" 
      placeholder="Digite sua senha"
    >

    <button id="btn-login">
      Entrar
    </button>

    <p>
      Não tem conta? 
      <a href="cadastro.html">Criar conta</a>
    </p>

    <p id="msg"></p>

  </div>

  <!-- SCRIPT -->
  <script type="module" src="auth.js"></script>

</body>
</html>
